{{ define "main" }}
<div class="list-page container">
  <div class="list-header">
    <h1>{{ .Title }}</h1>
    <p>{{ len .Pages }} bài viết</p>
  </div>
  <div class="posts-grid">
    {{ range .Pages.ByDate.Reverse }}
    <article class="post-card">
      <div class="post-card-meta">
        <span class="post-category">{{ with .Params.categories }}{{ index . 0 }}{{ end }}</span>
        <time>{{ .Date.Format "02 Jan 2006" }}</time>
      </div>
      <h3 class="post-card-title">
        <a href="{{ .RelPermalink }}">{{ .Title }}</a>
      </h3>
      <p class="post-card-summary">{{ .Summary }}</p>
      <div class="post-card-footer">
        <div class="post-tags">
          {{ range first 3 .Params.tags }}<span class="post-tag">{{ . }}</span>{{ end }}
        </div>
        <a href="{{ .RelPermalink }}" class="read-more">Read →</a>
      </div>
    </article>
    {{ end }}
  </div>
</div>
{{ end }}
