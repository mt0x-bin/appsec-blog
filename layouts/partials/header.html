<header class="site-header">
  <div class="container header-inner">
    <a href="{{ "/" | relURL }}" class="site-logo">
      <span class="logo-bracket">[</span>
      <span class="logo-text">AppSec<em>Journey</em></span>
      <span class="logo-bracket">]</span>
    </a>
    <nav class="site-nav">
      <a href="{{ "/" | relURL }}" class="{{ if .IsHome }}active{{ end }}">Home</a>
      <a href="{{ "/posts/" | relURL }}" class="{{ if (eq .Section "posts") }}active{{ end }}">Bài viết</a>
      <a href="{{ "/tags/" | relURL }}">Tags</a>
      <a href="{{ "/about/" | relURL }}">About</a>
      {{ with .Site.Params.github }}
      <a href="{{ . }}" target="_blank" class="nav-github">GitHub ↗</a>
      {{ end }}
    </nav>
    <button class="menu-toggle" aria-label="Toggle menu">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>
